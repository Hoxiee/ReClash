schema: 2
ladder:
    - rung: verdict
      enabled: true
    - rung: misfit
      enabled: true
    - rung: recurrence
      enabled: true
      recurrenceFloor: 2
    - rung: degraded
      enabled: true
    - rung: homeRisk
      enabled: true
    - rung: latency
      enabled: true
    - rung: evidence
      enabled: true
    - rung: unproven
      enabled: true
    - rung: incumbent
      enabled: true
    - rung: tiebreak
      enabled: true
strategies:
    balanced:
        bands:
            - 80
            - 120
            - 180
            - 320
        switchAbsMs: 30
        switchPct: 20
    lowest-latency:
        drop:
            - misfit
        bands:
            - 65
            - 90
            - 130
            - 220
        switchAbsMs: 15
        switchPct: 10
    saver:
        bands:
            - 150
            - 260
            - 420
            - 750
        switchAbsMs: 50
        switchPct: 30
    stable:
        bands:
            - 120
            - 200
            - 320
            - 550
        switchAbsMs: 50
        switchPct: 30
admission:
    - when:
        - transit is disproven
      verdict: reject
    - when:
        - trust is branded
      verdict: reject
    - when:
        - openWorld is disproven
        - domestic isNot proven
      verdict: reject
    - when:
        - exit is domestic
        - domestic is proven
      tier: domesticProven
    - when:
        - exit is domestic
      tier: domesticPrior
    - when:
        - openWorld is proven
        - breaker is true
      tier: breakerProven
    - when:
        - openWorld is proven
        - trust is suspect
        - exit is unknown
      verdict: last-resort
    - when:
        - openWorld is proven
      tier: openWorldProven
    - when:
        - openedOnce is true
        - openWorld isNot disproven
        - openLapsed is false
        - origin isNot domestic
        - breaker is true
      tier: breakerProven
    - when:
        - openedOnce is true
        - openWorld isNot disproven
        - openLapsed is false
        - origin isNot domestic
      tier: openWorldProven
    - when:
        - domestic is proven
      tier: domesticProven
    - when:
        - exit is unknown
        - origin is domestic
        - openedOnce is false
      tier: domesticPrior
    - tier: foreignPrior
probe:
    concurrency: 2
    staggerMs: 250
    budgetPerHour: 240
    reserve: 40
terrain:
    enabled: true
    checks:
        - foreign
        - domestic
        - sni
    rules:
        - when:
            - network.portal is true
          state: portal
        - when:
            - check.portal is true
          state: portal
        - when:
            - network.validated is false
            - network.unvalidatedMs lt 3000
          state: unknown
        - when:
            - check.foreign is ok
            - check.sni is fail
          state: whitelist
        - when:
            - check.domestic is ok
            - check.foreign isNot ok
          state: whitelist
        - when:
            - check.foreign is ok
          state: normal
        - when:
            - check.domestic is fail
          state: offline
        - state: unknown
    states:
        normal:
            kind: normal
            admission:
                openWorldProven: preferred
                domesticProven: last-resort
                breakerProven: viable
                foreignPrior: viable
                domesticPrior: last-resort
                allowLastResort: false
        offline:
            kind: offline
        portal:
            kind: portal
        unknown:
            kind: unknown
            admission:
                openWorldProven: preferred
                domesticProven: last-resort
                breakerProven: viable
                foreignPrior: viable
                domesticPrior: last-resort
                allowLastResort: true
        whitelist:
            kind: whitelist
            admission:
                openWorldProven: preferred
                domesticProven: viable
                breakerProven: preferred
                foreignPrior: viable
                domesticPrior: last-resort
                allowLastResort: true
    refreshSeconds: 300
    urgentSeconds: 30
    backoffSeconds: 180
    maxAgeSeconds: 600
    confirmationRounds: 2
    timeoutMs: 3000
    warmupMs: 5000
settings:
    strategy: balanced
    censorCountries: []
    canaryForeign: []
    canaryDomestic: []
    censorSNI: []
    openMarkers: []
    domesticMarkers: []
    localMarkers: []
    nameHints: []
    egressEchoes: []
    countryEchoes: []
    breakerPatterns: []
    lanes: []
    nodeRules: []
    avoidCountries: []
    latencyBands: []
    allowDomesticLastResort: true
    requireUDP: false
    respectPick: true
    dwellSeconds: 90
    waveWidth: 12
    proofTTLMinutes: 30
    degradeConfirmSeconds: 60
    absCeilingMs: 300
    throttleFloorKBps: 16
    switchImproveMs: 0
    switchImprovePct: 0
    latencyStepMs: 0
