display_name: ReClash

icon: ./assets/images/icon.png

supported_mime_type:
  - x-scheme-handler/clash
  - x-scheme-handler/clashmeta
  - x-scheme-handler/reclash
  - x-scheme-handler/incy
  - x-scheme-handler/happ
  - x-scheme-handler/vmess
  - x-scheme-handler/vless
  - x-scheme-handler/ss
  - x-scheme-handler/ssr
  - x-scheme-handler/trojan
  - x-scheme-handler/hysteria
  - x-scheme-handler/hysteria2
  - x-scheme-handler/hy2
  - x-scheme-handler/tuic
  - x-scheme-handler/anytls

keywords:
  - ReClash
  - Clash
  - ClashMeta
  - Proxy

generic_name: ReClash

# The bundled appimagetool enforces the freedesktop rule that a string-list
# key ends with ';'. The maker joins with ';' but omits the terminator, so the
# empty tail element supplies it, yielding Categories=Network;.
categories:
  - Network
  - ""

startup_notify: true
# Should equal the app id (com.reclash). NOTE: the current flutter_distributor
# appimage maker does not emit StartupWMClass; kept for parity/forward-compat.
startup_wm_class: com.reclash

include: []