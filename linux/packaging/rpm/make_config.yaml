display_name: ReClash

packager: Hoxiee
packagerEmail: hoxiee.dev@gmail.com
license: Other

priority: optional
section: x11
installed_size: 6604
essential: false
icon: ./assets/images/icon.png

requires:
  - libsecret

# rpmbuild's find-debuginfo and brp-strip rewrite the Core, and the Helper only
# starts a Core whose SHA256 matches the value built into it.
spec_macros:
  - '%global debug_package %{nil}'
  - '%global __os_install_post %{nil}'

postinstall_scripts:
  - 'update-desktop-database %{_datadir}/applications &> /dev/null || :'

supported_mime_type:
  - x-scheme-handler/clash
  - x-scheme-handler/clashmeta
  - x-scheme-handler/reclash
  - x-scheme-handler/incy
  - x-scheme-handler/happ
  - x-scheme-handler/hysteria
  - x-scheme-handler/hysteria2
  - x-scheme-handler/hy2
  - x-scheme-handler/hysteria2+realm
  - x-scheme-handler/hy2+realm
  - x-scheme-handler/tuic
  - x-scheme-handler/trojan
  - x-scheme-handler/vless
  - x-scheme-handler/vmess
  - x-scheme-handler/ss
  - x-scheme-handler/ssr
  - x-scheme-handler/socks
  - x-scheme-handler/socks5
  - x-scheme-handler/socks5h
  - x-scheme-handler/anytls
  - x-scheme-handler/mierus

keywords:
  - ReClash
  - Clash
  - ClashMeta
  - Proxy

generic_name: ReClash

group: Applications/Internet

startup_notify: true

startup_wm_class: com.reclash
