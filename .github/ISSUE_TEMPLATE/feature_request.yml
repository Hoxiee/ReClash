name: Feature request / Предложение функции
description: Describe a concrete need ReClash could address / Опишите конкретную задачу, которую может решить ReClash
title: '[Feature] '
body:
  - type: markdown
    attributes:
      value: |
        Start with the problem rather than a particular implementation. Search existing issues first; if the same need is already discussed, add your use case there.

        Начните с проблемы, а не с конкретной реализации. Сначала поищите похожие issues; если задача уже обсуждается, дополните существующее обращение своим сценарием.

        ReClash does not provide proxy subscriptions and cannot add provider-specific account features.

        ReClash не предоставляет прокси-подписки и не может добавлять функции управления аккаунтом конкретного провайдера.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case / Проблема или сценарий
      description: What are you trying to do, and what makes it difficult today? / Чего вы хотите добиться и что сейчас этому мешает?
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior / Ожидаемое поведение
      description: Describe the result you would expect in ReClash. / Опишите результат, который вы ожидаете от ReClash.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / Рассмотренные альтернативы
      description: Explain current workarounds or other approaches you considered. / Опишите используемые обходные пути или рассмотренные альтернативы.

  - type: dropdown
    id: platforms
    attributes:
      label: Relevant platforms / Затронутые платформы
      multiple: true
      options:
        - Android
        - Windows
        - macOS
        - Linux
        - All platforms / Все платформы
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context / Дополнительные сведения
      description: Add mockups, examples, or links that clarify the request. Do not include subscriptions or credentials. / Добавьте макеты, примеры или ссылки, поясняющие запрос. Не включайте подписки или учётные данные.

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation / Подтверждение
      options:
        - label: I searched existing issues and found no equivalent request. / Похожие предложения в существующих issues не найдены.
          required: true
