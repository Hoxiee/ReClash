name: Feature request / 功能建议
description: Describe a concrete need ReClash could address / 描述 ReClash 可以解决的具体需求
title: '[Feature] '
body:
  - type: markdown
    attributes:
      value: |
        Start with the problem rather than a particular implementation. Search existing issues first; if the same need is already discussed, add your use case there.

        请先描述问题，而不是直接限定实现方式。提交前请搜索现有 issue；若已有相同需求，请在原 issue 中补充使用场景。

        ReClash does not provide proxy subscriptions and cannot add provider-specific account features.

        ReClash 不提供代理订阅，也无法添加特定服务商的账号功能。

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case / 问题或使用场景
      description: What are you trying to do, and what makes it difficult today? / 你希望完成什么？目前的困难是什么？
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior / 期望行为
      description: Describe the result you would expect in ReClash. / 请描述你希望 ReClash 提供的结果。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / 已尝试的替代方案
      description: Explain current workarounds or other approaches you considered. / 请说明目前的变通方法或考虑过的其他方案。

  - type: dropdown
    id: platforms
    attributes:
      label: Relevant platforms / 相关平台
      multiple: true
      options:
        - Android
        - Windows
        - macOS
        - Linux
        - All platforms / 所有平台
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context / 其他信息
      description: Add mockups, examples, or links that clarify the request. Do not include subscriptions or credentials. / 可添加有助于说明需求的示意图、示例或链接，请勿包含订阅或凭据。

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation / 确认
      options:
        - label: I searched existing issues and found no equivalent request. / 我已搜索现有 issue，未发现相同建议。
          required: true
