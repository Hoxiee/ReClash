name: Bug report / Сообщение об ошибке
description: Report a reproducible problem in ReClash / Сообщить о воспроизводимой проблеме в ReClash
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve ReClash. [Search existing issues](https://github.com/Hoxiee/ReClash/issues) first and keep the report focused on one problem.

        Спасибо за помощь в улучшении ReClash. Сначала поищите похожие issues и описывайте одну проблему в одном обращении.

        **Privacy:** logs and profiles may contain subscription URLs, tokens, server addresses, local paths, and browsing activity. Remove sensitive data before posting. Do not upload an unreviewed log archive or full profile.

        **Конфиденциальность:** логи и профили могут содержать ссылки на подписки, токены, адреса серверов, локальные пути и историю посещений. Удалите личные данные перед публикацией. Не загружайте непроверенные архивы логов или полные профили.

  - type: input
    id: version
    attributes:
      label: ReClash version / Версия ReClash
      description: Copy the complete version from About, including a pre-release suffix if present. / Скопируйте полную версию из раздела «О приложении», включая суффикс предварительной версии.
      placeholder: 0.1.0-pre.1
    validations:
      required: true

  - type: dropdown
    id: source
    attributes:
      label: Build source / Источник сборки
      options:
        - GitHub Release
        - Built from source / Собрано из исходников
        - Other / Другое
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform / Платформа
      options:
        - Android
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: input
    id: platform-version
    attributes:
      label: Platform details / Сведения о системе
      description: Include the OS version and architecture. On Linux, also include the distribution, desktop environment, and display server. / Укажите версию ОС и архитектуру. Для Linux также укажите дистрибутив, окружение рабочего стола и графический сервер.
      placeholder: Android 16, arm64; Windows 11 24H2, x64; Arch Linux, KDE Plasma, Wayland, x64
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened? / Что произошло?
      description: Describe the actual behavior and what you expected instead. / Опишите фактическое и ожидаемое поведение.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / Шаги воспроизведения
      description: Give the smallest reliable sequence, including relevant settings. / Укажите минимальную последовательность для стабильного воспроизведения, включая значимые настройки.
      placeholder: |
        1. Open …
        2. Enable …
        3. Observe …
    validations:
      required: true

  - type: textarea
    id: regression
    attributes:
      label: Regression / Регрессия
      description: If this worked before, give the last known working ReClash version. / Если раньше всё работало, укажите последнюю рабочую версию ReClash.

  - type: textarea
    id: diagnostics
    attributes:
      label: Relevant diagnostics / Диагностические данные
      description: Paste only relevant text logs, stack traces, screenshots, or screen recordings after removing sensitive data. / После удаления личных данных добавьте относящиеся к проблеме текстовые логи, стеки ошибок, скриншоты или запись экрана.
      render: text

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation / Подтверждение
      options:
        - label: I searched existing issues and did not find this problem. / Похожие проблемы в существующих issues не найдены.
          required: true
        - label: I removed subscriptions, credentials, tokens, and personal data from this report. / Из обращения удалены подписки, учётные данные, токены и личная информация.
          required: true
