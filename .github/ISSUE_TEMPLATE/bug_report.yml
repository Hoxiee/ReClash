name: Bug report / 问题反馈
description: Report a reproducible problem in ReClash / 报告可复现的 ReClash 问题
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve ReClash. Search existing issues first and keep the report focused on one problem.

        感谢你帮助改进 ReClash。提交前请先搜索现有 issue，并在一个报告中只描述一个问题。

        **Privacy:** logs and profiles may contain subscription URLs, tokens, server addresses, local paths, and browsing activity. Remove sensitive data before posting. Do not upload an unreviewed log archive or full profile.

        **隐私提醒：** 日志和配置可能包含订阅地址、令牌、服务器地址、本地路径和访问记录。发布前请删除敏感信息，不要上传未经检查的日志压缩包或完整配置。

  - type: input
    id: version
    attributes:
      label: ReClash version / ReClash 版本
      description: Copy the complete version from About, including a pre-release suffix if present. / 请从“关于”页面复制完整版本，包括预发布后缀。
      placeholder: 0.8.97-pre.3
    validations:
      required: true

  - type: dropdown
    id: source
    attributes:
      label: Build source / 构建来源
      options:
        - GitHub Release
        - Built from source / 自行构建
        - Other / 其他
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform / 平台
      options:
        - Android
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: input
    id: platform-version
    attributes:
      label: Platform details / 平台信息
      description: Include the OS version and architecture. On Linux, also include the distribution, desktop environment, and display server. / 请提供系统版本和架构；Linux 还需提供发行版、桌面环境和显示服务器。
      placeholder: Android 16, arm64; Windows 11 24H2, x64; Arch Linux, KDE Plasma, Wayland, x64
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened? / 发生了什么？
      description: Describe the actual behavior and what you expected instead. / 请描述实际行为和预期行为。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤
      description: Give the smallest reliable sequence, including relevant settings. / 请提供最短且稳定的复现步骤，包括相关设置。
      placeholder: |
        1. Open …
        2. Enable …
        3. Observe …
    validations:
      required: true

  - type: textarea
    id: regression
    attributes:
      label: Regression / 是否曾经正常
      description: If this worked before, give the last known working ReClash version. / 如果旧版本中正常，请提供最后一个正常版本。

  - type: textarea
    id: diagnostics
    attributes:
      label: Relevant diagnostics / 相关诊断信息
      description: Paste only relevant text logs, stack traces, screenshots, or screen recordings after removing sensitive data. / 删除敏感信息后，仅粘贴相关文本日志、堆栈、截图或录屏。
      render: text

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation / 确认
      options:
        - label: I searched existing issues and did not find this problem. / 我已搜索现有 issue，未发现相同问题。
          required: true
        - label: I removed subscriptions, credentials, tokens, and personal data from this report. / 我已删除订阅、凭据、令牌和个人信息。
          required: true
