name: Website documentation

on:
  push:
    paths:
      - 'site'
      - 'docs/**'
      - 'provider_standard.g.json'
      - 'provider-policy.schema.json'
      - 'rcx-profile.schema.json'
      - 'tool/site_docs.mjs'
      - 'test/tool/site_docs_test.mjs'
      - '.github/workflows/site-docs.yaml'
  pull_request:
    paths:
      - 'site'
      - 'docs/**'
      - 'provider_standard.g.json'
      - 'provider-policy.schema.json'
      - 'rcx-profile.schema.json'
      - 'tool/site_docs.mjs'
      - 'test/tool/site_docs_test.mjs'
      - '.github/workflows/site-docs.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ReClash
    steps:
      - uses: actions/checkout@v4
        with:
          path: ReClash
      - uses: actions/checkout@v4
        with:
          repository: Hoxiee/reclash-site
          path: reclash-site
      - uses: actions/setup-node@v4
        with:
          node-version-file: reclash-site/.node-version
          cache: npm
          cache-dependency-path: reclash-site/package-lock.json
      - run: node --test test/tool/site_docs_test.mjs
      - run: node tool/site_docs.mjs --check
      - run: npm ci
        working-directory: reclash-site
      - run: npm run check
        working-directory: reclash-site
      - run: npx playwright install --with-deps chromium
        working-directory: reclash-site
      - run: npm run test:e2e
        working-directory: reclash-site
