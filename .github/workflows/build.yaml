name: build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: read

env:
  IS_STABLE: ${{ !contains(github.ref, '-') }}
  FLUTTER_VERSION: '3.47.1'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Test commit message hook
        shell: bash
        run: bash tool/check_commit_msg_test.sh

      - name: Test comment density hook
        shell: bash
        run: bash tool/check_comment_density_test.sh

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate release version
        shell: bash
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: dart run tool/check_release_version.dart "$TAG"

      - name: Check format
        run: dart format --output=none --set-exit-if-changed lib test tool plugins setup.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Verify changelog
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: dart run tool/changelog.dart verify

      - name: Run tests
        run: flutter test --reporter expanded --coverage

      - name: Check coverage
        run: dart run tool/check_coverage.dart coverage/lcov.info 75

      - name: Validate local Flutter packages
        shell: bash
        run: bash tool/check_plugins.sh

      - name: Validate setup build tool
        working-directory: plugins/setup/buildkit/build_tool
        run: |
          dart pub get
          dart analyze
          dart test

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: core/go.sum

      - name: Validate Go core wrapper
        working-directory: core
        shell: bash
        env:
          CGO_ENABLED: 0
        run: |
          # `go test` succeeds silently when a package has no test files, so
          # assert the wrapper actually ships tests before trusting the result.
          if ! compgen -G '*_test.go' > /dev/null; then
            echo 'No Go tests found in core/; the test step would pass vacuously.' >&2
            exit 1
          fi
          test -z "$(gofmt -l ./*.go ./platform ./tun)" || {
            gofmt -l ./*.go ./platform ./tun >&2
            exit 1
          }
          go test -count=1 .
          go vet .
          # `go vet .` only reaches the root package. `platform` and `tun` are
          # behind build constraints, so they need an explicit GOOS to compile
          # at all; without this they ship unvetted.
          GOOS=linux go vet ./platform

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: core-ndk
        with:
          ndk-version: r28c

      - name: Validate the Android core library
        working-directory: core
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.core-ndk.outputs.ndk-path }}
        run: |
          # The step above pins CGO_ENABLED=0, which excludes every `android &&
          # cgo` file: lib.go, bride.go, tun/ and platform/limit.go. The job
          # that builds them needs the NDK and only runs on a `v*` tag, so
          # without this the entire Android surface of the core first compiles
          # at release time.
          CC="$(echo "$ANDROID_NDK_HOME"/toolchains/llvm/prebuilt/*/bin/aarch64-linux-android21-clang)"
          test -x "$CC" || { echo "NDK clang not found at $CC" >&2; exit 1; }
          # Same tags the shipped library is built with; read from the build
          # tool's config so the two cannot drift.
          tags="$(sed -n 's/^tags: *//p' ../plugins/setup/buildkit/build_tool/build_config.yaml)"
          test -n "$tags" || { echo 'Could not read tags from build_config.yaml' >&2; exit 1; }
          export CGO_ENABLED=1 GOOS=android GOARCH=arm64 CC
          go vet "-tags=$tags" . ./tun ./platform

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run Android unit tests
        working-directory: android
        shell: bash
        env:
          ANDROID_NDK: ${{ steps.core-ndk.outputs.ndk-path }}
        run: |
          # settings.gradle.kts resolves the Flutter tooling through local.properties,
          # which only the Flutter build itself would otherwise generate.
          {
            echo "flutter.sdk=$FLUTTER_ROOT"
            echo "sdk.dir=$ANDROID_HOME"
          } > local.properties
          wrapper="$FLUTTER_ROOT/bin/cache/artifacts/gradle_wrapper"
          test -d "$wrapper" || flutter precache
          cp -R "$wrapper/." .
          chmod +x gradlew
          # Modules are listed explicitly: the aggregate testDebugUnitTest task would
          # also run third-party Flutter plugin suites. `:core` is omitted because its
          # only class loads the native library through System.loadLibrary.
          ./gradlew :common:testDebugUnitTest :service:testDebugUnitTest :app:testDebugUnitTest

      - name: Validate Rust components
        run: |
          cargo fmt --manifest-path services/helper/Cargo.toml -- --check
          cargo test --manifest-path services/helper/Cargo.toml
          cargo test --manifest-path services/helper/Cargo.toml --features linux-service
          cargo fmt --manifest-path plugins/rust_api/rust/Cargo.toml -- --check
          cargo test --manifest-path plugins/rust_api/rust/Cargo.toml

  windows-helper-test:
    name: Windows helper test
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check format
        run: cargo fmt --manifest-path services/helper/Cargo.toml -- --check

      - name: Run Windows service tests
        run: cargo test --manifest-path services/helper/Cargo.toml --features windows-service

  build:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [ test, windows-helper-test ]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: windows
            os: Windows-2022
            arch: amd64
          - platform: linux
            os: ubuntu-22.04
            arch: amd64
          - platform: macos
            os: macos-15-intel
            arch: amd64
          - platform: macos
            os: macos-latest
            arch: arm64
          - platform: windows
            os: windows-11-arm
            arch: arm64
          - platform: linux
            os: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Setup rust
        if: startsWith(matrix.os, 'windows-11-arm')
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://win.rustup.rs/aarch64" -OutFile rustup-init.exe
          .\rustup-init.exe -y --default-toolchain stable
          $cargoPath = "$env:USERPROFILE\.cargo\bin"
          Add-Content $env:GITHUB_PATH $cargoPath

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Android signing
        if: matrix.platform == 'android'
        shell: bash
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE" || -z "$KEY_ALIAS" || -z "$STORE_PASSWORD" || -z "$KEY_PASSWORD" ]]; then
            echo '::error::Android signing secrets are required for release tags.'
            exit 1
          fi
          echo "$KEYSTORE" | base64 --decode > android/app/keystore.jks
          {
            echo "keyAlias=$KEY_ALIAS"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
          } >> android/local.properties

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: |
            core/go.sum

      - name: Enable git long paths (Windows)
        if: startsWith(matrix.os, 'windows')
        run: git config --global core.longpaths true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Xcode
        if: startsWith(matrix.platform,'macos')
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app || sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version

      - name: Setup NDK
        if: startsWith(matrix.platform,'android')
        id: release-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          add-to-path: true
          link-to-sdk: true

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter pub get

      - name: Setup
        env:
          ANDROID_NDK: ${{ steps.release-ndk.outputs.ndk-path }}
        run: dart setup.dart ${{ matrix.platform }} ${{ env.IS_STABLE == 'true' && '--env stable' || '' }} -v

      - name: Reject unsafe Windows Helper releases
        if: startsWith(matrix.platform, 'windows')
        shell: bash
        run: |
          if find dist -type f \( -iname 'ReClashHelperService.exe' -o -iname 'FlClashHelperService.exe' \) -print -quit | grep -q .; then
            echo '::error::Windows Helper publishing is disabled until its privileged IPC is authenticated.'
            exit 1
          fi
          while IFS= read -r -d '' archive; do
            extracted="$(mktemp -d)"
            if ! 7z x -y -o"$extracted" "$archive" > /dev/null; then
              rm -rf "$extracted"
              echo "::error::Could not inspect packaged Windows artifact: $archive"
              exit 1
            fi
            if find "$extracted" -type f \( -iname 'ReClashHelperService.exe' -o -iname 'FlClashHelperService.exe' \) -print -quit | grep -q .; then
              rm -rf "$extracted"
              echo "::error::Unsafe Windows Helper found inside $archive"
              exit 1
            fi
            rm -rf "$extracted"
          done < <(find dist -maxdepth 1 -type f \( -iname '*.zip' -o -iname '*-setup.exe' \) -print0)

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.platform }}${{ matrix.arch && format('-{0}', matrix.arch) }}
          path: ./dist
          if-no-files-found: error
          overwrite: true

  validate-linux-packages:
    name: Validate Linux pacman packages
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist/
          pattern: artifact-linux-*
          merge-multiple: true

      - name: Query and install with pacman
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          pkgs=(dist/ReClash-*-linux-*.pkg.tar.xz)
          if (( ${#pkgs[@]} < 2 )); then
            echo "::error::Expected >=2 pacman packages, found ${#pkgs[@]}."
            exit 1
          fi
          docker run --rm -v "$PWD/dist:/dist" archlinux:latest \
            bash -euo pipefail -c '
              shopt -s nullglob
              for f in /dist/ReClash-*-linux-*.pkg.tar.xz; do
                echo "::group::$f"
                out="$(pacman -Qp "$f")"
                echo "$out"
                grep -Eq "^reclash 1:[0-9].*-[0-9]+$" <<<"$out" \
                  || { echo "::error::$f has a non-installable version: $out"; exit 1; }
                echo "::endgroup::"
              done
              amd=(/dist/ReClash-*-linux-amd64.pkg.tar.xz)
              pacman -U --noconfirm --nodeps "${amd[0]}"
              info="$(pacman -Qi reclash)"
              echo "$info"
              grep -q gtk3 <<<"$info" \
                || { echo "::error::Dependencies missing after install."; exit 1; }
            '

  upload:
    name: Publish release
    permissions:
      contents: write
    needs: [ build, validate-linux-packages ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist/
          pattern: artifact-*
          merge-multiple: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify release asset manifest
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(dart run tool/check_release_version.dart "$TAG")"
          expected=(
            "ReClash-$version-android-arm64-v8a.apk"
            "ReClash-$version-android-armeabi-v7a.apk"
            "ReClash-$version-android-x86_64.apk"
            "ReClash-$version-linux-amd64.AppImage"
            "ReClash-$version-linux-amd64.deb"
            "ReClash-$version-linux-amd64.pkg.tar.xz"
            "ReClash-$version-linux-amd64.rpm"
            "ReClash-$version-linux-arm64.deb"
            "ReClash-$version-linux-arm64.pkg.tar.xz"
            "ReClash-$version-linux-arm64.rpm"
            "ReClash-$version-macos-amd64.dmg"
            "ReClash-$version-macos-arm64.dmg"
            "ReClash-$version-windows-amd64-setup.exe"
            "ReClash-$version-windows-amd64.zip"
            "ReClash-$version-windows-arm64-setup.exe"
            "ReClash-$version-windows-arm64.zip"
          )
          printf '%s\n' "${expected[@]}" | sort > expected-assets.txt
          find dist -maxdepth 1 -type f -printf '%f\n' | sort > actual-assets.txt
          if ! diff -u expected-assets.txt actual-assets.txt; then
            echo '::error::Release assets do not match the required manifest.'
            exit 1
          fi
          while IFS= read -r asset; do
            if [[ ! -s "dist/$asset" ]]; then
              echo "::error::Release asset is empty: $asset"
              exit 1
            fi
          done < expected-assets.txt

      - name: Generate release notes
        shell: bash
        env:
          IS_STABLE: ${{ env.IS_STABLE }}
          TAG: ${{ github.ref_name }}
        run: |
          target=()
          if [[ "$IS_STABLE" == 'true' ]]; then
            target=(--tag "$TAG")
          else
            dart run tool/changelog.dart build --unreleased
          fi
          notes=".github/release_notes/$TAG.md"
          if [[ -f "$notes" ]]; then
            cp "$notes" release.md
          else
            dart run tool/changelog.dart render release "${target[@]}" --out release.md
            version="$(dart run tool/check_release_version.dart "$TAG")"
            sed "s|VERSION|$version|g; s|/download/v$version/|/download/$TAG/|g" \
              .github/release_template.md >> release.md
          fi

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/*
          body_path: release.md
          prerelease: ${{ env.IS_STABLE != 'true' }}

      - name: Detect Telegram credentials
        id: telegram
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          if [[ -n "$TELEGRAM_BOT_TOKEN" && -n "$TELEGRAM_API_ID" && -n "$TELEGRAM_API_HASH" ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Telegram credentials are incomplete; skipping the announcement.'
          fi

      - name: Prepare Telegram announcement
        if: steps.telegram.outputs.enabled == 'true'
        shell: bash
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          IS_STABLE: ${{ env.IS_STABLE }}
          TAG: ${{ github.ref_name }}
        run: |
          target=()
          if [[ "$IS_STABLE" == 'true' ]]; then
            target=(--tag "$TAG")
          fi
          dart run tool/changelog.dart render telegram "${target[@]}" --out telegram.md
          docker run -d --rm --name telegram-bot-api -p 8081:8081 \
            -e TELEGRAM_API_ID -e TELEGRAM_API_HASH aiogram/telegram-bot-api:latest
          for attempt in {1..30}; do
            if curl --silent --fail http://localhost:8081/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs telegram-bot-api
          exit 1

      - name: Announce on Telegram
        if: steps.telegram.outputs.enabled == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TAG: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python -m pip install --disable-pip-version-check requests==2.32.5
          python release_telegram.py
