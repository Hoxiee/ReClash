name: build

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
    paths-ignore:
      - 'README*.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  pull_request:
    branches: [ main, dev ]
    paths-ignore:
      - 'README*.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  workflow_dispatch:
    inputs:
      build_packages:
        description: Build installable packages without publishing
        type: boolean
        default: false
      run_tests:
        description: Run checks on this push
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  IS_STABLE: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
  # See CI Caches in .agents/commands.md.
  BRANCH_CACHE: ${{ !startsWith(github.ref, 'refs/tags/') }}
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'
  NDK_VERSION: r28c

jobs:
  dart:
    name: Dart
    # A private copy pays for its Actions minutes, so it runs the checks only when
    # started by hand.
    if: (github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v') || inputs.run_tests || inputs.build_packages) && (github.event_name == 'workflow_dispatch' || !github.event.repository.private)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Test Telegram release publishing
        run: python3 -I -m unittest discover -s test/tool -p changelog_telegram_test.py

      - name: Test git hooks
        run: bash tool/hooks/test.sh

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/rust_api/rust
          cache-directories: .dart_tool/hooks_runner
          save-if: ${{ env.BRANCH_CACHE }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: ${{ env.BRANCH_CACHE }}

      - name: Prepare application sources
        run: dart tool/prepare.dart

      - name: Check generated application sources stay untracked
        run: |
          test -z "$(git ls-files -- 'arb/intl_*.arb' lib/l10n lib/models/generated lib/providers/generated lib/database/generated lib/ui/generated)"

      - name: Validate release version
        shell: bash
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: dart run tool/check_release_version.dart "$TAG"

      - name: Check format
        run: dart tool/check_format.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Skip the Go core build hook
        run: |
          yq -i '.hooks.user_defines.setup.build_assets = false' pubspec.yaml

      - name: Verify changelog
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: dart run tool/changelog.dart verify

      - name: Run tests
        run: dart run tool/test.dart -- --reporter expanded --coverage

      - name: Check coverage
        run: dart run tool/check_coverage.dart coverage/lcov.info 75

  plugins:
    name: Plugins
    if: (github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v') || inputs.run_tests || inputs.build_packages) && (github.event_name == 'workflow_dispatch' || !github.event.repository.private)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: ${{ env.BRANCH_CACHE }}

      - name: Validate local Flutter packages
        run: bash tool/check_plugins.sh

      - name: Validate setup hooks package
        working-directory: plugins/setup/setup_hooks
        run: |
          dart pub get
          dart analyze
          dart test

  desktop:
    name: Desktop ${{ matrix.platform }}
    if: (github.event_name == 'workflow_dispatch' || !github.event.repository.private) && !startsWith(github.ref, 'refs/tags/v') && !inputs.build_packages
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-2022
          - platform: macos
            os: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            core/go.sum
            plugins/setup/setup_hooks/lib/src/go_builder.dart

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.platform }}
          workspaces: |
            services/helper
            plugins/rust_api/rust
          cache-directories: .dart_tool/hooks_runner

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libayatana-appindicator3-dev libsecret-1-dev

      - name: Setup Xcode
        if: matrix.platform == 'macos'
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app || sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version

      - name: Enable git long paths (Windows)
        if: matrix.platform == 'windows'
        run: git config --global core.longpaths true

      - name: Prepare application sources
        run: dart tool/prepare.dart

      # Compiles the desktop runners and the native plugin code that only the
      # tagged release matrix built before; the bundle itself is discarded.
      - name: Build debug bundle
        run: flutter build ${{ matrix.platform }} --debug

  go:
    name: Go core
    if: (github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v') || inputs.run_tests || inputs.build_packages) && (github.event_name == 'workflow_dispatch' || !github.event.repository.private)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: ${{ env.BRANCH_CACHE }}
          cache-dependency-path: core/go.sum

      - name: Validate Go core wrapper
        working-directory: core
        env:
          CGO_ENABLED: 0
        run: |
          if ! compgen -G '*_test.go' > /dev/null; then
            echo 'No Go tests found in core/; the test step would pass vacuously.' >&2
            exit 1
          fi
          test -z "$(gofmt -l ./*.go ./cmd ./mobile ./platform ./tun)" || {
            gofmt -l ./*.go ./cmd ./mobile ./platform ./tun >&2
            exit 1
          }
          go test -count=1 . ./cmd/core
          go vet . ./cmd/...
          GOOS=linux go vet ./platform

      - name: Validate the Android core library
        working-directory: core
        env:
          CGO_ENABLED: 0
        run: |
          tags="$(sed -n 's/^tags: *//p' ../build_config.yaml)"
          test -n "$tags" || { echo 'Could not read tags from build_config.yaml' >&2; exit 1; }
          GOOS=android GOARCH=arm64 go vet "-tags=$tags" . ./mobile ./tun ./platform

  android:
    name: Android unit tests
    if: (github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v') || inputs.run_tests || inputs.build_packages) && (github.event_name == 'workflow_dispatch' || !github.event.repository.private)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: ${{ env.BRANCH_CACHE }}
          cache-dependency-path: |
            core/go.sum
            android/core/build.gradle.kts

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: ${{ env.BRANCH_CACHE }}

      - name: Install dependencies
        run: flutter pub get

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          link-to-sdk: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

      - name: Run Android unit tests
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          {
            echo "flutter.sdk=$FLUTTER_ROOT"
            echo "sdk.dir=$ANDROID_HOME"
          } > local.properties
          wrapper="$FLUTTER_ROOT/bin/cache/artifacts/gradle_wrapper"
          test -d "$wrapper" || flutter precache
          cp -R "$wrapper/." .
          chmod +x gradlew
          # No JVM unit test loads the Core or the Flutter build, but `:core` compiles against
          # the gomobile AAR, so one ABI of it is built.
          ./gradlew :common:testDebugUnitTest :service:testDebugUnitTest :app:testDebugUnitTest \
            -Ptarget-platform=android-arm64 \
            -x :app:compileFlutterBuildDebug -x :app:copyFlutterAssetsDebug

  rust:
    name: Rust
    if: (github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v') || inputs.run_tests || inputs.build_packages) && (github.event_name == 'workflow_dispatch' || !github.event.repository.private)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            services/helper
            plugins/rust_api/rust
          save-if: ${{ env.BRANCH_CACHE }}

      - name: Check format
        run: |
          cargo fmt --manifest-path services/helper/Cargo.toml -- --check
          cargo fmt --manifest-path plugins/rust_api/rust/Cargo.toml -- --check

      - name: Run tests
        run: |
          cargo test --locked --manifest-path services/helper/Cargo.toml
          cargo test --locked --manifest-path plugins/rust_api/rust/Cargo.toml

  windows-helper-test:
    name: Windows native backend test (${{ matrix.arch }})
    if: (github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v') || inputs.run_tests || inputs.build_packages) && (github.event_name == 'workflow_dispatch' || !github.event.repository.private)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            arch: amd64
            msvc: x64
          - os: windows-11-arm
            arch: arm64
            msvc: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            services/helper
            plugins/rust_api/rust
          save-if: ${{ env.BRANCH_CACHE }}

      - name: Check format
        run: cargo fmt --manifest-path services/helper/Cargo.toml -- --check

      - name: Run Windows service tests
        run: cargo test --locked --manifest-path services/helper/Cargo.toml --features windows-service

      - name: Run managed Windows backend tests
        run: cargo test --locked --manifest-path plugins/rust_api/rust/Cargo.toml

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: ${{ env.BRANCH_CACHE }}
          cache-dependency-path: core/go.sum

      - name: Validate Windows Core bootstrap
        working-directory: core
        env:
          CGO_ENABLED: 0
          RECLASH_REQUIRE_WINDOWS_BOOTSTRAP: '1'
        run: go test -v -count=1 -timeout=5m ./cmd/core

  build:
    # Releases publish where the release links point: the public repository.
    if: >-
      (github.repository == 'Hoxiee/ReClash' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.build_packages)
    needs: [ dart, plugins, go, android, rust, windows-helper-test ]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: windows
            os: Windows-2022
            arch: amd64
          - platform: linux
            os: ubuntu-22.04
            arch: amd64
          - platform: macos
            os: macos-15-intel
            arch: amd64
          - platform: macos
            os: macos-latest
            arch: arm64
          - platform: windows
            os: windows-11-arm
            arch: arm64
            flutter-channel: master
          - platform: linux
            os: ubuntu-24.04-arm
            arch: arm64
            flutter-channel: master

    steps:
      - name: Setup rust
        if: startsWith(matrix.os, 'windows-11-arm')
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://win.rustup.rs/aarch64" -OutFile rustup-init.exe
          .\rustup-init.exe -y --default-toolchain stable
          $cargoPath = "$env:USERPROFILE\.cargo\bin"
          Add-Content $env:GITHUB_PATH $cargoPath

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Android signing
        if: matrix.platform == 'android'
        shell: bash
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE" || -z "$KEY_ALIAS" || -z "$STORE_PASSWORD" || -z "$KEY_PASSWORD" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == 'push' ]]; then
              echo '::error::Release tags require all Android signing secrets.'
              exit 1
            fi
            echo '::notice::No signing secrets: building a debug-signed com.reclash.dev package.'
            exit 0
          fi
          printf '%s' "$KEYSTORE" | base64 --decode > android/app/keystore.jks
          {
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } >> android/local.properties

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: ${{ env.BRANCH_CACHE }}
          cache-dependency-path: core/go.sum

      - name: Setup Gradle
        if: startsWith(matrix.platform,'android')
        uses: gradle/actions/setup-gradle@v6

      - name: Enable git long paths (Windows)
        if: startsWith(matrix.os, 'windows')
        run: git config --global core.longpaths true

      # Stable publishes no Windows or Linux arm64 archive; master makes the action
      # clone the SDK at the pinned tag and let it fetch the host's own Dart SDK.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.flutter-channel || 'stable' }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: ${{ env.BRANCH_CACHE }}

      - name: Setup Xcode
        if: startsWith(matrix.platform,'macos')
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app || sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version

      - name: Setup NDK
        if: startsWith(matrix.platform,'android')
        uses: nttld/setup-ndk@v1
        id: build-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Prepare application sources
        run: |
          flutter --version
          dart tool/prepare.dart

      - name: Validate package version
        shell: bash
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: dart run tool/check_release_version.dart "$TAG"

      # See .agents/flutter-upgrade.md before bumping FLUTTER_VERSION.
      - name: Disable Impeller on Intel macOS
        if: matrix.platform == 'macos' && matrix.arch == 'amd64'
        run: plutil -replace FLTEnableImpeller -bool NO macos/Runner/Info.plist

      # The core embeds this bundle and ReClashHttpOverrides.trustCoreRoots loads it for Dart.
      # Pinned by hash, so a new bundle from https://curl.se/docs/caextract.html is a reviewed bump.
      - name: Fetch CA certificates
        shell: bash
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
          CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
        run: |
          bundle=core/mihomo/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: Setup
        env:
          ANDROID_NDK_HOME: ${{ steps.build-ndk.outputs.ndk-path }}
        run: dart setup.dart ${{ matrix.platform }} ${{ env.IS_STABLE == 'true' && '--env stable' || '' }} -v

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.platform }}${{ matrix.arch && format('-{0}', matrix.arch) }}
          path: ./dist
          if-no-files-found: error
          overwrite: true
          retention-days: ${{ github.event_name == 'workflow_dispatch' && 7 || 1 }}

  validate-linux-packages:
    name: Validate Linux pacman packages
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: ${{ env.BRANCH_CACHE }}

      - name: Prepare package inspection
        run: |
          yq -i '.hooks.user_defines.setup.build_assets = false | .hooks.user_defines.rust_api.build_assets = false' pubspec.yaml
          flutter pub get

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist/
          pattern: artifact-*
          merge-multiple: true

      - name: Verify package manifest
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          version=$(dart run tool/check_release_version.dart "$TAG")
          dart run tool/check_release_assets.dart "${TAG:-v$version}"

      - name: Generate checksums
        run: |
          cd dist
          find . -maxdepth 1 -type f -printf '%f\0' |
            sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: package-checksums
          path: dist/SHA256SUMS
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'workflow_dispatch' && 7 || 1 }}

      - name: Query and install with pacman
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          pkgs=(dist/ReClash-*-linux-*.pkg.tar.xz)
          if (( ${#pkgs[@]} < 2 )); then
            echo "::error::Expected >=2 pacman packages, found ${#pkgs[@]}."
            exit 1
          fi
          docker run --rm -v "$PWD/dist:/dist" archlinux:latest \
            bash -euo pipefail -c '
              shopt -s nullglob
              for f in /dist/ReClash-*-linux-*.pkg.tar.xz; do
                echo "::group::$f"
                out="$(pacman -Qp "$f")"
                echo "$out"
                grep -Eq "^reclash 1:[0-9].*-[0-9]+$" <<<"$out" \
                  || { echo "::error::$f has a non-installable version: $out"; exit 1; }
                echo "::endgroup::"
              done
              amd=(/dist/ReClash-*-linux-amd64.pkg.tar.xz)
              # Keep the install offline; inspect declared dependencies afterwards.
              pacman -U --noconfirm --nodeps --nodeps "${amd[0]}"
              info="$(pacman -Qi reclash)"
              echo "$info"
              grep -q gtk3 <<<"$info" \
                || { echo "::error::Dependencies missing after install."; exit 1; }
            '

  validate-windows-packages:
    name: Validate Windows packages (${{ matrix.arch }})
    needs: [ build ]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            arch: amd64
          - os: windows-11-arm
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64
          cache: ${{ env.BRANCH_CACHE }}

      - name: Install dependencies
        run: flutter pub get

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: artifact-windows-${{ matrix.arch }}
          path: ./dist/

      - name: Skip native build hooks for package inspection
        shell: pwsh
        run: |
          (Get-Content pubspec.yaml -Raw).Replace('build_assets: true', 'build_assets: false') |
            Set-Content pubspec.yaml

      - name: Validate, install, upgrade and launch the package
        shell: pwsh
        env:
          REQUIRE_SIGNED: ${{ vars.WINDOWS_SIGNING_REQUIRED }}
        run: |
          if ($env:REQUIRE_SIGNED -notin @($null, '', 'false', 'true')) {
            throw 'WINDOWS_SIGNING_REQUIRED must be empty, false or true'
          }
          $zips = @(Get-ChildItem dist -Filter '*-windows-${{ matrix.arch }}.zip')
          $setups = @(Get-ChildItem dist -Filter '*-windows-${{ matrix.arch }}-setup.exe')
          if ($zips.Count -ne 1 -or $setups.Count -ne 1) {
            throw 'Expected exactly one ZIP and one installer for this architecture'
          }
          & ./tool/check_windows_package.ps1 -ZipPath $zips[0].FullName `
            -SetupPath $setups[0].FullName -Arch '${{ matrix.arch }}' `
            -RequireSigned:($env:REQUIRE_SIGNED -eq 'true') -AllowInstall

      - name: Upload Windows package diagnostics
        if: always() && env.WINDOWS_PACKAGE_LOGS != ''
        uses: actions/upload-artifact@v4
        with:
          name: windows-package-logs-${{ matrix.arch }}
          path: ${{ env.WINDOWS_PACKAGE_LOGS }}
          if-no-files-found: warn
          retention-days: 7

  upload:
    if: github.repository == 'Hoxiee/ReClash' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    needs: [ build, validate-linux-packages, validate-windows-packages, dart, plugins, go, android, rust, windows-helper-test ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download
        uses: actions/download-artifact@v4
        with:
          path: ./dist/
          pattern: artifact-*
          merge-multiple: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: ${{ env.BRANCH_CACHE }}

      - name: Install dependencies
        run: flutter pub get

      - name: Skip native build hooks
        run: |
          yq -i '.hooks.user_defines.setup.build_assets = false | .hooks.user_defines.rust_api.build_assets = false' pubspec.yaml

      - name: Verify release asset manifest
        env:
          TAG: ${{ github.ref_name }}
        run: dart run tool/check_release_assets.dart "$TAG"

      - name: Generate release notes
        shell: bash
        env:
          IS_STABLE: ${{ env.IS_STABLE }}
          TAG: ${{ github.ref_name }}
        run: |
          target=(--tag "$TAG")
          if [[ "$IS_STABLE" != 'true' ]]; then
            dart run tool/changelog.dart build --unreleased
          fi
          dart run tool/changelog.dart render release "${target[@]}" --out release.md
          dart run tool/changelog.dart render telegram "${target[@]}" --out telegram.md

      - name: Patch release.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(dart run tool/check_release_version.dart "$TAG")
          sed "s|VERSION|$version|g" ./.github/release_template.md >> release.md

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' |
            sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/*
          body_path: './release.md'
          prerelease: ${{ env.IS_STABLE != 'true' }}
          make_latest: ${{ env.IS_STABLE == 'true' && 'true' || 'false' }}
          fail_on_unmatched_files: true

      - name: Detect optional publishing credentials
        id: publishing
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          HOMEBREW_KEY: ${{ secrets.HOMEBREW_SSH_DEPLOY_KEY }}
          FDROID_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
        run: |
          if [[ -n "$TELEGRAM_BOT_TOKEN" ]]; then
            echo 'telegram=true' >> "$GITHUB_OUTPUT"
          fi
          if [[ -n "$HOMEBREW_KEY" ]]; then echo 'homebrew=true' >> "$GITHUB_OUTPUT"; fi
          if [[ -n "$FDROID_KEY" ]]; then echo 'fdroid=true' >> "$GITHUB_OUTPUT"; fi

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: release-checksums
          path: dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

      - name: Create Homebrew Cask Source Dir
        if: ${{ env.IS_STABLE == 'true' }}
        run: |
          version=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          arm_sha=$(sha256sum "./dist/ReClash-${version}-macos-arm64.dmg" | awk '{print $1}')
          amd_sha=$(sha256sum "./dist/ReClash-${version}-macos-amd64.dmg" | awk '{print $1}')

          mkdir -p ./brew/Casks
          sed \
            -e "s|VERSION|$version|g" \
            -e "s|ARM_SHA256|$arm_sha|g" \
            -e "s|AMD_SHA256|$amd_sha|g" \
            ./.github/homebrew_cask_template.rb > ./brew/Casks/reclash.rb

      - name: Push to Homebrew tap
        if: env.IS_STABLE == 'true' && steps.publishing.outputs.homebrew == 'true'
        uses: cpina/github-action-push-to-another-repository@v1.7.2
        env:
          SSH_DEPLOY_KEY: ${{ secrets.HOMEBREW_SSH_DEPLOY_KEY }}
        with:
          source-directory: ./brew/
          destination-github-username: Hoxiee
          destination-repository-name: homebrew-tap
          user-name: 'Hoxiee'
          user-email: 'hoxiee.dev@gmail.com'
          target-branch: main
          commit-message: Update Homebrew cask from ${{ github.ref_name }}
          target-directory: /

      - name: Create Fdroid Source Dir
        if: ${{ env.IS_STABLE == 'true' }}
        run: |
          mkdir -p ./tmp
          cp ./dist/*android-arm64-v8a.apk ./tmp/
          echo "Files copied successfully"

      - name: Push to fdroid repo
        if: env.IS_STABLE == 'true' && steps.publishing.outputs.fdroid == 'true'
        uses: cpina/github-action-push-to-another-repository@v1.7.2
        env:
          SSH_DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
        with:
          source-directory: ./tmp/
          destination-github-username: Hoxiee
          destination-repository-name: ReClash-fdroid-repo
          user-name: 'Hoxiee'
          user-email: 'hoxiee.dev@gmail.com'
          target-branch: main
          commit-message: Update from ${{ github.ref_name }}
          target-directory: /tmp/

      - name: Push to telegram
        if: steps.publishing.outputs.telegram == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TAG: ${{ github.ref_name }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID || '@ReClashApp' }}
        run: python3 -I release_telegram.py
