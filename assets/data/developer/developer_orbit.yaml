mixed-port: 7890
mode: rule
log-level: info
proxies:
  - name: Orbit North
    type: ss
    server: 127.0.0.1
    port: 8390
    cipher: aes-256-gcm
    password: orbit-north
  - name: Orbit South
    type: ss
    server: 127.0.0.1
    port: 8391
    cipher: aes-256-gcm
    password: orbit-south
proxy-groups:
  - name: Orbit Select
    type: select
    proxies: [Orbit North, Orbit South, DIRECT]
  - name: Orbit Auto
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    proxies: [Orbit North, Orbit South]
rules:
  - MATCH,Orbit Select
