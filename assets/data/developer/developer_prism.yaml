mixed-port: 7890
mode: rule
log-level: info
proxies:
  - name: Prism Violet
    type: ss
    server: 127.0.0.1
    port: 8388
    cipher: aes-256-gcm
    password: prism-violet
  - name: Prism Blue
    type: ss
    server: 127.0.0.1
    port: 8389
    cipher: aes-256-gcm
    password: prism-blue
proxy-groups:
  - name: Prism Select
    type: select
    proxies: [Prism Violet, Prism Blue, DIRECT]
rules:
  - MATCH,Prism Select
