mixed-port: 7890
mode: rule
log-level: info
proxies:
  - name: Atlas Berlin
    type: ss
    server: 127.0.0.1
    port: 8392
    cipher: aes-256-gcm
    password: atlas-berlin
  - name: Atlas Tokyo
    type: ss
    server: 127.0.0.1
    port: 8393
    cipher: aes-256-gcm
    password: atlas-tokyo
  - name: Atlas Seattle
    type: ss
    server: 127.0.0.1
    port: 8394
    cipher: aes-256-gcm
    password: atlas-seattle
proxy-groups:
  - name: Atlas Select
    type: select
    proxies: [Atlas Berlin, Atlas Tokyo, Atlas Seattle, DIRECT]
  - name: Atlas Fastest
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    proxies: [Atlas Berlin, Atlas Tokyo, Atlas Seattle]
rules:
  - MATCH,Atlas Select
