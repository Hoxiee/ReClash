v: 1
kind: feature
state: active
risk: routine
must:
  channels: Release excludes prereleases; Pre includes eligible stable and prerelease updates, with build-aware defaults.
  outcomes: Manual checks distinguish no update from request failures.
  installation: Android installs only a checksum-verified app asset and retains pending permission state.
  recovery: Pending permission installs resume from bootstrap without downloading the APK again.
  cleanup: Update cleanup never deletes the APK named by a pending installation.
  notes: Authored localized release summaries lead the sheet; mandatory warnings remain visible, notes match the offered tag, and full notes expand in place.
  consent: Checking, Wi-Fi preloading and automatic installation are independent preferences; dismissing an offer does not disable checks.
  background: Dismissing the sheet leaves transfers observable; pinned partial downloads resume without publishing unchecked APKs.
  vpn: Installation never stops an active or starting VPN without a fresh explicit user action.
  automatic: Only verified stable releases with an authored safe-install policy and no warnings can install automatically; Android confirmation remains authoritative.
  localization: All update labels and installer errors are owned by feature ARB fragments.
watch: [test/helpers/test_update_runtime.dart, test/widgets/update_sheet_test.dart, lib/common/update_summary.dart, lib/common/app_update_state.dart, lib/common/app_update_runtime.dart, lib/providers/app_update.dart, lib/widgets/update_sheet.dart, lib/widgets/update_card.dart, lib/widgets/update_preferences.dart, lib/widgets/update_content.dart, lib/views/dashboard/dashboard.dart, 'android/app/src/main/kotlin/com/reclash/updates/**', 'android/tests/app/*Update*Test.kt', test/common/update_summary_test.dart, test/providers/app_update_action_test.dart, test/plugins/app_update_test.dart, tool/src/changelog/summary.dart, tool/changelog.dart, tool/src/changelog/render.dart, test/tool/update_summary_tool_test.dart, release_summaries/README.md, 'release_summaries/**', lib/common/request.dart, lib/common/package.dart, lib/common/update.dart, lib/common/app_update.dart, lib/providers/actions/common.dart, lib/providers/actions/app_update.dart, lib/providers/action.dart, lib/state.dart, lib/bootstrap.dart, lib/common/common.dart, lib/models/config.dart, lib/views/application_setting.dart, lib/widgets/update_offer_dialog.dart, lib/widgets/release_notes.dart, lib/plugins/app.dart, android/app/src/main/kotlin/com/reclash/plugins/AppPlugin.kt, android/app/src/main/AndroidManifest.xml, android/app/src/main/res/xml/file_paths.xml, 'arb/fragments/app.updates/**', test/common/helpers_test.dart, test/common/request_test.dart, test/common/app_update_test.dart, test/models/config_test.dart, test/widgets/update_dialog_test.dart, test/views/application_setting_test.dart, test/widgets/uncovered_views_test.dart]
