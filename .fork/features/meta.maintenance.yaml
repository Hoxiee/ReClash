v: 1
kind: meta
state: active
risk: critical
must:
  preserve: Preparation does not change caller WIP or accepted development refs.
  provenance: Vendor trees retain the observed source identity and upstream gitlink values.
  skill-entry: The Claude maintenance skill resolves to the checked-in canonical agent skill.
  observability: Status and reports are read-only, distinguish missing evidence from successful checks, and never grant authority.
  chain-acceptance: Chain verification binds the exact standalone recipe predecessor and includes its impact; acceptance preserves original development before moving refs and remains resumable.
  archive-retention: Accepted syncs retain the latest two managed archive/dev-before-<sync-id> branches; only receipt-owned matching refs are pruned, after successful acceptance, with recovery bundles preserved.
  history: Each sync candidate uses a parentless product base matching the prepared vendor tree; downstream history is linear above it.
watch: ['.fork/**', 'tool/fork.dart', 'tool/src/fork/**', 'test/tool/fork*', 'AGENTS.md', '.agents/**', '.claude/skills/fork-maintenance', '.claude/agents/**', tool/test.dart, 'tool/src/test_select/**', test/tool/test_select_test.dart, tool/preview.dart, 'tool/preview/**', test/tool/preview_test.dart, .gitignore, analysis_options.yaml, lint_options.yaml, tool/check_format.dart, tool/check_generated_contracts.dart, tool/database_schema.dart, 'tool/src/maintenance/**', test/tool/generated_contracts_test.dart, test/tool/database_schema_tool_test.dart, 'tool/hooks/**', test/tool/check_format_test.dart]
checks:
  fork-tests: [preserve, provenance, skill-entry, history, observability, chain-acceptance, archive-retention]
  generated-contracts: [observability]
