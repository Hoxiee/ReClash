v: 1
kind: feature
state: active
risk: routine
must:
  single-protocol: Provider data comes from one registry, the standard headers plus one reclash-config pointer to a manifest whose fields the registry lists; the body stays plain mihomo with no reclash-* or rcx-* keys, and unknown fields never mutate local configuration.
  opt-in-identity: Device identity is controlled globally with device-local profile overrides; sending always includes all four headers for the identifier, OS name, OS version and device model, with unavailable details left empty, and a manifest on another origin never receives them.
  transport-safety: Subscription fetches bound redirects, headers, wire bytes, decompressed bytes, timeout and cancellation.
  route-fallback: The current route is tried first; one explicitly marked bypass retries only a pre-response transport failure or timeout, within the original deadline, using Android socket protection or the desktop TUN interface finder.
  safe-import: Unknown and encrypted bytes pass through; conversions report every unsupported section and skipped node.
  staged-update: Invalid, empty, stale or superseded downloads never replace the saved profile file.
  portable-secrets: Device identity and consent stay outside portable profile backups.
  provider-settings: A subscription's app settings apply by default and carry a provider tag; a user change takes the setting from the provider until it is handed back, and withdrawing a manifest section or key restores the user's value; the settings map touches only listed keys. Only application settings offer a confirmed bulk return of provider-managed app settings, app-wide DNS/TUN/general overrides and released provider apps, including changes made before the next sync; local values and manual app lists remain stored. Backgrounds reuse cached PNG or original SVG files; SVGs are never rasterized for storage or display.
  provider-apps: Recommended provider app lists add to the user's list in the same access-control mode; modes are never mixed and an app the user unticks stays released. Versioned required exclusions override releases, whitelist inclusions and disabled access control, remain visibly locked, disclose direct-IP use and require Android VPN enforcement; desktop ignores them.
  provider-policy: The guarantee is native mihomo config (a GLOBAL group and tun.exclude-package); the manifest policy values global=listed and apps=required make ReClash enforce it, and a missing manifest leaves only the native part. GLOBAL permissions follow the GLOBAL group's resolved members, filter included, with the Core as the only authority; they derive from the group's inline nodes and bind to original route definitions independently of scripts and controller reloads; actual TCP and UDP leaf dials and RCX candidates honor them. Stale native exclusions and unknown app identities fail closed, while desktop ignores required apps, never falling back to DIRECT.
  provider-hosts: Fallback hosts (manifest transport) never replace the stored URL; a new domain is adopted only after it serves a valid profile; both require an https subscription.
  provider-support: Support keys (at most two Ed25519 keys) and the support upload URL are read only from a manifest named in an HTTPS response, never a body comment, and are replaced on every update.
  provider-messages: Announce is a persistent, non-removable subscription description shown only from provider data and never listed in the widget editor; desktop previews morph into a centered reader; the manifest notice supplies a separate dismissible message whose changed content shows again.
  provider-cards: Provider cards never mutate settings, import subscriptions or toggle the connection; they appear only from provider data and stay out of the widget editor.
  provider-config: The manifest named by reclash-config in an HTTPS response is the only source of provider presentation, reminders, settings, apps, transport, support and routing declarations. It never fails a subscription update, is replaced whole only after validation, loses a section when a new valid copy omits it, and is deleted when the header is missing; a section that is invalid is withdrawn except the four aliased provider fields, which fall back to their standard header; settings stay put while a named file is still being read.
  provider-restrictions: The manifest policy section only removes options (Global mode, local ports on Android, dashboard editing) and never grants access.
watch: [provider-config.schema.json, 'core/provider_policy*.go', lib/subscriptions/**, lib/models/provider_settings.dart, lib/providers/provider_settings.dart, lib/widgets/provider_setting.dart, lib/widgets/announcement_card.dart, lib/widgets/provider_cards.dart, 'arb/fragments/subscriptions.providers/**', tool/gen_provider_standard.dart, provider_standard.g.json, 'docs/en/providers/**', lib/models/profile.dart, lib/database/profiles.dart, lib/database/database.dart, lib/providers/actions/profiles.dart, lib/views/config/general.dart, lib/views/profiles/edit.dart, arb/fragments/profiles.compatibility/**, lib/core/interface.dart, lib/core/method.dart, lib/core/controller.dart, core/subscription_fetch.go, core/subscription_fetch_android.go, core/subscription_fetch_desktop.go, core/subscription_fetch_test.go, core/protocol.go, core/method.go, core/rule_set.go, test/subscriptions/**]
checks:
  subscription-foundation: [single-protocol, opt-in-identity, transport-safety, route-fallback, safe-import, provider-support]
  subscription-standard: [single-protocol]
  profiles: [staged-update, portable-secrets]
  provider-controls: [provider-settings, provider-apps, provider-hosts, provider-restrictions, provider-messages, provider-cards, provider-config, provider-policy]
  go-provider-policy: [provider-policy]
  android-notifications: [provider-apps]
drop: Provider-triggered reports and telemetry are not implemented.
