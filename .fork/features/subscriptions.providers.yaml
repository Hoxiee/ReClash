v: 1
kind: feature
state: active
risk: routine
must:
  single-protocol: Supported provider fields come from one registry and unknown fields never mutate local configuration.
  opt-in-identity: Device identity is off by default, controlled globally with device-local profile overrides, and device details require profile-origin consent.
  transport-safety: Subscription fetches bound redirects, headers, wire bytes, decompressed bytes, timeout and cancellation.
  safe-import: Unknown and encrypted bytes pass through; conversions report every unsupported section and skipped node.
  staged-update: Invalid, empty, stale or superseded downloads never replace the saved profile file.
  portable-secrets: Device identity and consent stay outside portable profile backups.
watch: [lib/subscriptions/**, tool/gen_provider_standard.dart, provider_standard.g.json, PROVIDER_HEADERS.md, PROVIDER_FEATURES.md, lib/models/profile.dart, lib/database/profiles.dart, lib/database/database.dart, lib/providers/actions/profiles.dart, lib/views/config/general.dart, lib/views/profiles/edit.dart, arb/fragments/profiles.compatibility/**, lib/core/interface.dart, lib/core/method.dart, lib/core/controller.dart, core/subscription_fetch.go, core/subscription_fetch_android.go, core/protocol.go, core/method.go, core/rule_set.go, test/subscriptions/**]
checks:
  subscription-foundation: [single-protocol, opt-in-identity, transport-safety, safe-import]
  subscription-standard: [single-protocol]
  profiles: [staged-update, portable-secrets]
drop: Provider-controlled appearance, settings, routing, reports, and telemetry are not implemented.
