v: 1
kind: feature
state: active
risk: routine
must:
  identity: Inserting, removing or reordering tabs retains the active page by identity rather than index.
  ownership: Visited pages mount lazily and retain state; a returning page has no duplicate outgoing copy.
  motion: Reduced motion immediately settles page and navigation-strip transitions.
  responsive: Responsive breakpoints and desktop header geometry remain consistent at their boundaries.
  keyboard: Ctrl+1 through Ctrl+9 selects the corresponding currently visible navigation item.
  layout: The navigation layout setting can force the bar or the sidebar; automatic keeps Android tablets on the bar and others on the width breakpoints.
  axis: Page switches slide along the destinations of the navigation in use, sideways under a bar and vertically beside the sidebar, and sliding pages never overlap.
watch: [lib/pages/home.dart, lib/common/layout.dart, lib/views/navigation.dart, lib/ui/nav_slots.dart, lib/ui/navigation_bar.dart, lib/ui/navigation_dock.dart, lib/ui/tab_motion.dart, test/common/layout_test.dart, test/pages/home_test.dart, test/pages/home_dynamic_navigation_test.dart, test/widgets/nav_slots_test.dart, test/widgets/navigation_bar_test.dart, test/widgets/navigation_dock_test.dart]
checks:
  navigation: [identity, ownership, motion, responsive, keyboard, layout, axis]
