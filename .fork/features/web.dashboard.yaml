checks:
  web-dashboard-storage: [storage, panels]
  web-dashboard-access: [panels, access, ownership, failure]
  web-dashboard-ui: [navigation, interface, failure]
  localization: [localization]
  localization-assembly: [localization]
deps: [core.integration, settings.specs, localization.catalog]
drop: Remove only when both managed dashboards, safe installation and runtime-owned authenticated access are preserved upstream.
