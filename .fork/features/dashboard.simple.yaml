v: 1
kind: feature
state: active
risk: routine
must:
  opt-in: The classic dashboard stays the default; the simple one is chosen in Appearance or from either dashboard's app bar.
  layout: Phones show home and widgets as two pager pages and desktops side by side; entering or leaving edit mode keeps the page in view; a swipe turns the page once on distance or fling and never leaves it between two.
  widgets: The simple widget set and order persist apart from the classic dashboard's, unknown names are dropped, a provider's denyWidgets disables editing, and a provider's presentation.widgets list sets the simple set where it has a counterpart; only the provider's presentation.powerButton header sets the on-state shape and type of the power button.
  mode: Auto is a separate switch below the manual choices; while active, those choices are disabled but show the live effective tunnel mode.
  provider: Announcements and notices sit on the widgets page; support, renewal and top-up links come only from the subscription's safe links.
  speed: Тест запускается вручную из нативного sheet; настройки открываются следующей страницей его внутреннего navigator без второго sheet. Тест использует текущий HTTP-маршрут без автоматического перехода на DIRECT и останавливается при смене сети или маршрута, закрытии sheet либо уходе приложения в фон.
  speed-metrics: Сменные backend-адаптеры отделены от движка и UI; первым подключён Cloudflare. Download и upload измеряются последовательно, HTTP-задержка и jitter — в покое и под нагрузкой; частичные результаты сохраняются, потери UDP не имитируются.
  speed-budget: Общий бюджет тестовых данных включает прогрев, загрузку и отправку; лимитные и неизвестные сети требуют подтверждения до первого запроса, а экономный вариант диалога запускает только пробы задержки. Настройки платформы, режима и бюджета сохраняются.
watch: ['lib/views/dashboard/simple/**', 'lib/features/speed_test/**', lib/models/speed_test.dart, lib/common/network_cost.dart, lib/plugins/app.dart, android/app/src/main/kotlin/com/reclash/plugins/AppPlugin.kt, lib/views/dashboard/widgets/card.dart, lib/providers/speed_test.dart, lib/widgets/announcement_card.dart, 'assets/images/flags/**', 'arb/fragments/dashboard.simple/**', lib/views/navigation.dart, lib/views/theme.dart, lib/views/theme_preview.dart, lib/views/dashboard/dashboard.dart, lib/models/config.dart, lib/enum/enum.dart, lib/subscriptions/metadata/hints.dart, lib/subscriptions/provider_settings.dart, test/views/dashboard/simple_dashboard_test.dart, test/providers/speed_test_test.dart, test/features/speed_test_engine_test.dart, test/features/speed_test_fakes.dart, test/views/speed_test_sheet_test.dart, test/models/config_test.dart]
checks:
  simple-dashboard: [opt-in, layout, widgets, mode, provider, speed, speed-metrics, speed-budget]
deps: [subscriptions.providers, settings.specs]
drop: Upstream ships an equivalent opt-in simple dashboard.
