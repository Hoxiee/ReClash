v: 1
kind: feature
state: active
risk: routine
must:
  default: The simple dashboard is the default for a new install and for an unknown saved style; the detailed one is chosen in Appearance or from either dashboard's app bar.
  layout: Phones show home and widgets as two pager pages and desktops side by side; entering or leaving edit mode keeps the page in view; a swipe turns the page once on distance or fling and never leaves it between two.
  widgets: The simple widget set and order persist apart from the classic dashboard's, unknown names are dropped, a provider's denyWidgets disables editing, and a hosted config's widgets list sets the simple set where it has a counterpart.
  power-button: Only the hosted config's power-button section sets the running button's shape and fill. Existing shape names retain their silhouettes, with burst staying soft and sharpBurst selecting the sharp burst. A fixed shape, random over all shapes, or a deduplicated comma-separated pool is supported; unknown names are ignored and an empty valid pool falls back to cookie. A random choice stays stable within the app session until the profile or valid pool changes; metadata refreshes, fill changes and view rebuilds do not reroll it.
  face: The home power button is one pure face resolved from the run state, the kernel's findings, the supervisor's verified health and the account guard; it shows Protected with a check only after a verified check, a tap while running always stops, a stopped problem's tap opens its fix or sheet, and the one fix under the title is a pill whose renew or top-up replaces the subscription card's own buttons; the Smart power button application setting, on by default, gates all of this, and when off the face is the plain run state, the guard never locks or stops the tunnel, no account notices appear and the supervisor does not heal by itself.
  mode: Auto is a separate switch below the manual choices; while active, those choices are disabled but show the live effective tunnel mode.
  path: The path widget always shows the kernel's connection path as a chain of step badges, including waiting and successful states, keeps the result and timing below it, and opens the full path with timings.
  provider: Announcements, notices and provider cards sit on the widgets page; a provider's power labels replace only the status title, and the hint only where no fix pill shows, for the off, connecting, on, paused, expired, exhausted, ending and grace faces, never the live line or the real state's colour, shape, badge and semantics; support, renewal and top-up links come only from the subscription's safe links.
  speed: The test starts manually from a native sheet; its settings open as the next page on the sheet's own navigator, never as a second sheet. The test uses the current HTTP route without automatic DIRECT fallback and stops when the network or route changes, the sheet closes, or the app enters the background.
  speed-metrics: Swappable backend adapters stay separate from the engine and UI; Cloudflare is the first backend. Download and upload are measured sequentially, with HTTP latency and jitter measured both idle and under load; partial results are retained, and UDP packet loss is not simulated.
  speed-budget: The shared test-data budget includes warm-up, download and upload; metered and unknown networks require confirmation before the first request, and the economical dialog option runs latency probes only. Platform, mode and budget settings persist.
  traffic: The traffic card forecasts from one sample per URL profile day, kept 60 days and written only when a profile write brings a new subscription counter; the pace is read from the last seven whole days, and unlimited or perpetual plans show no run-out date.
  simplest: Picking the simple dashboard in Appearance from the detailed one, with a profile, reveals the simplest dashboard on a 1% roll. It is forgotten on restart, the saved style falling back to simple, unless pinned from its tile's context menu; its only control runs the same toggle as the power button.
