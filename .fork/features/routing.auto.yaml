v: 1
kind: feature
state: active
risk: critical
must:
  pure-decision: The routing decision is a pure function of policy, evidence and context, and its explanation is the ranking it decided on.
  energy: No check runs with the screen off unless real traffic fails, nothing runs in Doze or sleep, simple profiles stay within 30 requests an hour and advanced ones within 80.
  escrow: Failures seen while no traffic gets through condemn no node.
  layers: Provider and user layers only narrow a profile's pool; an invalid profile or unusable group is a visible problem, never a silent fallback.
  manual-control: A manual pick in a smart group pins it; manual mode never switches.
  thin-fork: The mihomo fork carries only per-provider health-check suppression, the endpoint fingerprint and the direct-split hook for routing.
  direct-split: Only the user turns direct-split on; local destinations and the final MATCH rule never leave through the tunnel.
  consent: A provider profile contacts hosts beyond its provider's site and the built-in endpoints only after the user allows them; until then its group runs builtin/simple and says why.
  studio: Lint, simulation, format and merge are read-only; a profile changes what a group runs only once saved.
  profile-text: A profile carries its own translations; the app shows the user's language and falls back to the source text.
  scenario: A scenario sets the tunnel mode only until the user picks one, and drives only the groups it names; the rest keep their own profile.
  routes: A scenario's routes become groups and rules only at a config apply and steer traffic only in rule mode, never over a group the config already has; a route that cannot apply is a visible problem.
  ladder: A server order falls through to the next step once every server on a step is down, and a last-resort step yields to every other step; a scenario program's order beats the user's, which beats the profile's.
  bundle: An exported setup carries every non-built-in profile it references, and importing it never replaces a profile the user already has.
watch: ['core/rcx/**', 'core/rcx_*.go', core/hooks.go, core/proxy.go, core/mihomo/adapter/provider/patch.go, core/mihomo/adapter/route_identity.go, core/mihomo/tunnel/patch.go, android/service/src/main/java/com/reclash/service/modules/NetworkObserveModule.kt, lib/models/rcx.dart, lib/providers/routing.dart, lib/views/proxies/routing.dart, 'lib/views/proxies/routing_*.dart', lib/views/config/routing.dart, lib/views/dashboard/widgets/outbound_mode.dart, lib/common/rcx_link.dart, rcx-profile.schema.json, tool/rcx.dart, android/service/src/main/java/com/reclash/service/modules/RoutingHintsModule.kt, 'arb/fragments/routing.auto/**', test/views/proxies/routing_test.dart, test/views/proxies/routing_studio_test.dart, test/views/proxies/routing_hub_test.dart, test/views/proxies/routing_route_test.dart, test/views/proxies/routing_scenario_test.dart, core/config.go, PROVIDER_FEATURES.md, 'docs/auto-routing/**']
checks:
  routing-engine: [pure-decision, energy, escrow, layers, manual-control, direct-split, consent, studio, scenario, routes, ladder, bundle]
  routing-ui: [layers, manual-control, studio, profile-text, scenario, routes, bundle]
  fork-tests: [thin-fork]
deps: [core.integration, proxies.groups]
drop: Upstream ships an auto-routing engine with the same transparency, energy limits and provider tolerance.
