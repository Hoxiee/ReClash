v: 1
kind: feature
state: active
risk: routine
must:
  catalog: Tools remain available through the catalog and command providers.
  shortcut-details: Desktop shortcut exports remain nested beneath shortcut management, not a new root Tools destination.
  dashboard-entry: The web dashboard remains a searchable child of General beside the external controller, never a root Tools destination.
  url-scheme: The link builder, inspector and command catalog stay inside the Tools workspace across desktop and mobile.
  workspace-navigation: The mobile catalog is the actual root route, not a separately observed overlay; split catalogs stay outside detail transitions, and replacements never expose the recent landing or let removed pages truncate the latest path.
  workspace-presentation: All Tools pages share their nested path header without a redundant Tools root; recent and Core rows match settings gutters, normal bodies keep their content to a centered column while their scroll views and scrollbar span the pane, runtime editors fill the pane and nested sheets keep their own presentation. Sections a Tools page lists are Tools pages, and pages a Tools page pushes, such as auto-routing groups, scenarios and editors, continue its path inside the workspace.
  workspace-surfaces: Split panes share stationary wallpaper and route-driven headers with one persistent breadcrumb renderer that interpolates common segment typography, color and position without swapping to different settled widgets; a header stays while a menu or dialog covers its page. Every Tools page covers the pages beneath with a stationary copy of the shared wallpaper, pages slide in over the page beneath, which trails them by a quarter of the width and fades, the reverse of a drag back, and compact pages carry their own app bars through those slides and back gestures, without header morphs or persistent catalog selection.
  mobile-navigation: Tab switches move Tools content and page backdrops without translating its header, wallpaper or navigation, and Tools headers hide at once as other tabs' do; compact Tools navigation belongs to the catalog route while Tools holds it and is covered by detail pages rather than faded or collapsed separately; a floating bar stays with the tab a switch started from until the switch ends; back gestures uncover it with the catalog it belongs to, keyboard visibility still applies, and appearance categories keep the same safe-area baseline.
watch: ['lib/views/tools/**', lib/views/url_scheme.dart, lib/features/url_scheme/**, lib/common/url_scheme.dart, lib/common/link.dart, lib/providers/actions/url_scheme.dart, lib/views/tools.dart, 'lib/providers/tool*', 'lib/models/tools.dart', 'lib/models/tool_route.dart', lib/common/tools_search.dart, lib/pages/home.dart, 'arb/fragments/tools.catalog/**', test/common/tools_search_test.dart, test/providers/tools_test.dart, test/views/tools_catalog_test.dart, test/views/url_scheme_view_test.dart, test/pages/home_test.dart, test/widgets/tools_workspace_test.dart]
checks:
  tools: [catalog, shortcut-details, dashboard-entry, url-scheme, workspace-navigation, workspace-presentation, workspace-surfaces, mobile-navigation]
deps: [settings.specs]
drop: Upstream provides the same available commands and required interactions.
