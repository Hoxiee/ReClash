v: 1
kind: feature
state: active
risk: routine
why: First connection setup stays in one wizard without background autostart or global setup errors.
deps: [app.region, desktop.hotkeys, localization.catalog, profiles.no-duplicates, settings.specs, subscription.compatibility]
must:
  first-run: Incomplete first-run setup shows the wizard from the first frame without a dashboard flash; a ready wizard counts as a launched app even before setup completes, and existing installations keep their startup behavior.
  language: Language selection precedes consent and updates the interface reactively; Core and imports cannot start before consent.
  consent: Consent requires reading to the end; declining or abandoning an import never completes setup.
  draft: Step, profile, coverage, an explicitly neutral region and the direct-routes choice persist separately from active configuration until the summary commits them; an interrupted setup resumes at its step.
  imports: Link, file and QR imports reuse client presets, conversion, explicit loss approval, validation and duplicate prevention; age-key retry, cancellation and errors remain inside the wizard, rejected or failed imports leave no profile files, and imports do not change active selection; on a TV a phone sends the link over the local network in place of camera QR scanning.
  coverage: Desktop offers TUN, system proxy and local proxy; Android offers VPN and local proxy; coverage never promises to proxy all traffic.
  region: Region is its own step independent of UI locale; until the user chooses, the detected region is preselected and marked recommended, manual choices win, and choosing or going back changes only the draft.
  journey: Having profiles never skips a step; every installation walks profile, coverage, region and summary, and continuing without a profile is an explicit choice.
  ownership: Starting goes through the existing connection owners; an already running connection is re-applied rather than restarted, and finishing without connecting leaves the run state alone.
  finish: The summary lists every choice and reopens its step; finishing commits the draft, optionally connects, and enables autostart only with a profile outside safe mode; failed persistence keeps setup incomplete.
  skip: Skipping replaces exit once consent is given; it confirms, keeps the current configuration, selects a draft profile if one exists, and completes setup.
  errors: Import, startup and profile-apply failures stay inside the wizard without global notifiers or unrelated navigation.
  shortcuts: Active setup permits only window visibility and exit actions; network-changing native events and local shortcuts remain blocked until setup completes.
  direct-routes: A region with a preset recommends its direct rules, added once to the global rules on commit; on Android VPN local apps are searched only on an explicit request, the found apps bypass the VPN through access control, and declining or a neutral region adds neither.
  navigation: Every step after language goes back to its predecessor without losing the draft, and completed steps reopen from the step bar, receipt or summary.
  presentation: The wizard uses app components, typography, superellipses and primary selection checks without selected-row fills; header, content and one primary action share a left edge, the action bar keeps its height on every step, the receipt stays beside the content on wide layouts, and phone or long text layouts do not overflow.
  localization: All wizard messages belong to app.setup fragments with matching keys and placeholders across supported locales.
