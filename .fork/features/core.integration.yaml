v: 1
kind: integration
state: active
risk: critical
must:
  latest-intent: Desktop stop or close supersedes pending start and releases its lease.
  protocol: Structured requests and events remain compatible with the shared protocol fixtures.
  source: The ReClash engine fork and pin are changed only after explicit compatibility review.
  controller: Typed controller requests retain validation and delegation behavior.
  privilege-intent: Privileged Core launch consumes only an explicit one-shot authorization grant, and installing or updating a Helper or service only the setup prompt's install grant; background and Safe Mode paths never prompt and fall back to an unprivileged Core, and disconnected Core settings remain local without RPC or authorization.
  privileged-files: Managed privileged Core pins its application home; file RPCs cannot escape it through traversal, symlinks or hard links.
  privilege-state: Helper registration, active privileged lease and applied TUN are separate states; system DNS follows confirmed TUN.
  native-backends: Linux uses per-owner network capabilities, Windows an owner-scoped LocalSystem service whose managed Core binds the GUI and pins its home (verified UAC jobs only for an elevated GUI), and macOS signed XPC registration with a scoped managed Core.
  helper-installation: Linux replacement requires a verified owned unit and confirmed shutdown; installer failures retain bounded diagnostics and rollback preserves the previous registration.
  windows-packaging: Windows ships only the hash-verified ReClashService (protocol 10) beside Core, installed into a protected Program Files copy, never the legacy ReClashHelperService; both architectures validate runtime dependencies, installed payload and owned upgrade/uninstall shutdown before publication.
  dashboard-controller: Temporary dashboard access never persists controller changes, respects Safe Mode and saved settings, and patches through the existing serialized setup owner without starting Core or VPN.
