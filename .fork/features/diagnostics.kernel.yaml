v: 1
kind: feature
state: active
risk: routine
must:
  taxonomy: FailureCause is the one closed failure set; core/doctor.go classifies mihomo errors into the same wire ids and lib/common/network_error.dart folds its kinds into it.
  snapshot: Rules are pure functions of an immutable snapshot of typed facts, run off the UI isolate once the snapshot grows, and a missing or stale fact never raises a finding.
  probes: Probes are deduplicated per key, cached by TTL and bounded by cost class; a newer intent supersedes the run in flight and the Core leaving connected cancels every run.
  remedies: Remedies are the only kernel code that changes state, verify through the rules, snapshot Config when undoable and refuse an undo once the config moved on; restarts, reconnects and account stops are requested through commonAction, coreAction and setupAction, never owned.
  journal: Every diagnostic event is published live and persisted, keeping the last 100 incidents; the doctor page shows the latest 30 in a history section that starts collapsed and toggles from its header.
  path: Every consumer runs the one connection path through runPath; steps run in order through the probe scheduler, the first failure stops the chain and the rest show as skipped, routed steps are RoutedProbe answers judged against routeTrackerProvider, and the Core leaving ends a run as cancelled; the verify scope dials reach and generate_204 through the main group under its own probe keys and never replaces the path the doctor page shows.
  findings: Findings reach the user through the health card on both dashboards, the doctor page and the simple home power face, which shows only the top finding as its own state and action, never a separate banner; a button appears only for a remedy the platform registers, critical findings cannot be snoozed, Android device state comes from native plugins as facts, and an unavailable battery policy remains unknown.
  reach: Every remedy declares its reach; a foreign one runs only on a confirmed user tap, never from a heal plan, explain or the healer, and no remedy kills processes, changes services, drivers or autostart, or adds hosts entries.
  supervisor: ConnectionSupervisor verifies on connect within a 15 s budget, on network change after a 5 s settle, on resume past 2 min and on an outside remedy, never on a polling timer or while hidden; broken takes two failures 3 s apart, unknown is never a problem, a failed connect is confirmed the same way, auto-heal climbs profile update and connection reset, repair adds the Core and tunnel restarts, the main group's node moves only on the user's switch-server tap, and recovering shows only past 800 ms.
  account: AccountGuard locks only on fresh figures that say the plan ended plus a broken connection with account evidence, refreshes stale figures at most every 10 min, stops and resumes the tunnel through remedies with a persisted memo, never resumes after the user acted, and an override holds 24 h for one expiry and total.
  environment: Environment sensors only read; on Windows they reach the system through win32 FFI, never a spawned tool, hosts is filtered to relevant domains off the UI isolate past 2000 lines, and the catalogue only names software whose effect was already found.
  healing: With autoHeal on, the healer applies one app or own auto remedy per raised env finding, at most 3 in 10 minutes, announces it with Undo, and silently takes back an undoable change that did not clear its finding.
  fixlinks: A reclash://fix link applies nothing until the user confirms its sheet; it must parse strictly, carry a key an HTTPS subscription of an installed profile sent, verify by Ed25519, expire within 7 days, spend a persisted nonce once and name a report this device made for that profile within 30 days, and every action must be allowlisted, run for that profile only and never be a foreign remedy, a subscription URL, a new profile or arbitrary config.
watch: ['lib/features/doctor/**', lib/plugins/doctor.dart, lib/plugins/battery.dart, lib/providers/on_demand.dart, android/app/src/main/kotlin/com/reclash/plugins/DoctorPlugin.kt, android/app/src/main/kotlin/com/reclash/plugins/BatteryPlugin.kt, test/providers/on_demand_test.dart, 'test/views/doctor/**', 'lib/views/doctor/**', core/doctor.go, core/doctor_test.go, lib/common/network_error.dart, 'test/features/doctor/**', 'arb/fragments/diagnostics.kernel/**', 'arb/fragments/diagnostics.fixlinks/**', 'arb/fragments/diagnostics.report/**', lib/common/proxy.dart]
checks:
  diagnostics-kernel: [snapshot, probes, remedies, journal, path, supervisor, account, findings, reach, environment, healing, fixlinks]
  go-doctor: [taxonomy, path]
deps: [core.integration]
drop: Upstream ships an equivalent diagnostic kernel.
