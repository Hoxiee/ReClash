v: 1
kind: feature
state: active
risk: routine
must:
  selection: App region is independent of interface locale; detection never applies a profile without explicit user confirmation.
  detection: Region detection uses only local time zone and system locale, never SIM or mobile network data.
  preview: Country changes show a plain summary of affected areas before apply; cancellation leaves stored and runtime configuration unchanged.
  layout: Region settings share the settings workspace width constraints, responsive layout and navigation.
  preservation: Applying or switching a region replaces only values still at the previous region's defaults; custom DNS, routes, MTU, bypass, and service preferences stay.
  reversibility: Removing or switching the region does not duplicate rules or lose underlying user settings.
  android: Domestic app matching is country-specific, honors shared exclusions, and unknown regions match nothing.
  localization: All region labels, impact summaries, warnings, and apply actions are owned by region feature ARB fragments.
  settings: Applying a region writes its DNS, MTU and bypass list into the regular settings shown by the editors; Restore defaults on Network and DNS returns them to the region's values.
  services: Explicitly enabled and disabled checks survive region changes, including an empty enabled set.
  service-automation: Service checks include Telegram, Sberbank, Gosuslugi, VK, Kinopoisk and Yandex; persisted automation defaults to enabled services only, connected only, after three stable seconds, while manual checks remain independent.
  app-selection: Smart selection explains the regional VPN split and replacement of both manual lists before confirmation; its footbar action replaces the zero count while nonempty selections retain the count. Errors, empty matches, cancellation, changed inputs and disposal never replace lists. A subscription's `domestic` routing asks for none and only adds provider apps, tagged, without touching the user's lists.
  setup-preview: The wizard region step changes only the draft until a check or save commits it; going back or leaving preserves active settings.
