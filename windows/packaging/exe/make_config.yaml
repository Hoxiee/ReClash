script_template: inno_setup.iss
app_id: E642C6C1-B712-41C2-969E-3C2049CA883F
app_name: ReClash
publisher_name: Hoxiee
publisher_url: https://github.com/Hoxiee/ReClash
display_name: ReClash
executable_name: ReClash.exe
output_base_file_name: ReClash.exe
# Resolved against the project root: flutter_distributor turns this into an
# absolute path via Directory.current.
setup_icon_file: windows\runner\resources\app_icon.ico
create_desktop_icon: true
locales:
  # A locale with a `file:` is emitted into the .iss verbatim (path relative to
  # the generated script in dist/); one without it is kept only when the maker
  # finds the stock .isl next to ISCC. en/ru ship with Inno; zh/ko are vendored.
  - lang: en
  - lang: ru
  - lang: zh
    file: ..\windows\packaging\exe\ChineseSimplified.isl
  - lang: ko
    file: ..\windows\packaging\exe\Korean.isl
privileges_required: admin
