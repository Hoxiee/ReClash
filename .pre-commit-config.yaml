repos:
  - repo: local
    hooks:
      - id: dart-format
        name: dart format
        entry: dart format
        language: system
        files: \.dart$
        exclude: '(^|/)(build|generated|upstream_l10n)/|(^|/)lib/l10n/intl/|(^|/)lib/l10n/l10n\.dart$|\.g\.dart$|\.freezed\.dart$|(^|/)frb_generated[^/]*\.dart$|(^|/)open_container\.dart$'
        stages: [pre-commit]
      - id: comment-density
        name: comment density
        entry: tool/hooks/comment_density.sh
        language: system
        files: \.(dart|kt|kts|swift|go|rs|java|cpp|cc|h|hpp|gradle|ya?ml)$
        stages: [pre-commit]
      - id: flutter-analyze
        name: prepare and flutter analyze (pre-push)
        entry: dart tool/prepare.dart -- analyze --no-fatal-infos
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: commit-msg-format
        name: conventional commit message
        entry: tool/hooks/commit_msg.sh
        language: system
        stages: [commit-msg]
